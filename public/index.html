<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>J.A.R.V.I.S.</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="grid-bg"></div>
  <header>
    <h1>J.A.R.V.I.S.</h1>
    <span id="status" class="status">Bereit</span>
  </header>

  <main>
    <button id="reactor" class="reactor" title="Klicken zum Sprechen" aria-label="Sprechen">
      <span class="ring r1"></span>
      <span class="ring r2"></span>
      <span class="ring r3"></span>
      <span class="core"></span>
    </button>
    <p id="hint" class="hint">Klicke auf den Reaktor oder drücke die Leertaste, um zu sprechen.</p>

    <section id="log" class="log" aria-live="polite"></section>
  </main>

  <footer>
    <form id="form" autocomplete="off">
      <input id="input" type="text" placeholder="Nachricht an Jarvis…" />
      <button type="submit" id="sendBtn">Senden</button>
    </form>
    <div class="controls">
      <label><input type="checkbox" id="ttsToggle" checked /> Sprachausgabe</label>
      <label><input type="checkbox" id="wakeToggle" /> Wake-Word „Jarvis“</label>
      <select id="voiceSelect" title="Stimme"></select>
      <button id="clearBtn" type="button">Verlauf löschen</button>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
